# Site settings
title: Tim Maes
description: A blog about .NET development, software engineering, and tech insights
baseurl: ""
url: "https://tim-maes.com"

# Author settings
author:
  name: Tim Maes
  email: tim.maes91@gmail.com

# Build settings
markdown: kramdown
theme: minima
encoding: utf-8

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Permalink structure
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      categories: ["blog"]
      image: /assets/images/og-default.png
  # Social preview image for all other pages. Override per post/page with `image:`.
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .vs/

feed:
  path: feed.xml
  excerpt_only: true
  categories:
    - blog

excerpt_separator: "<!--more-->"


# Giscus comments (https://giscus.app). Fill in repo_id and category_id to enable.
giscus:
  repo: Tim-Maes/Tim-Maes.github.io
  repo_id: "R_kgDOLh2FHw"
  category: Announcements
  category_id: "DIC_kwDOLh2FH84DIfI9"
